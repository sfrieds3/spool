name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENSPEC_VERSION: 1.17.0

jobs:
  check:
    name: Format, vet and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run mise run fmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: mise run vet
      - run: mise run test
      - run: go test -race ./...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o "dist/spool" ./cmd/spool
      - uses: actions/upload-artifact@v4
        with:
          name: spool-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/spool
          retention-days: 7

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current main for PR validation
        if: github.event_name == 'pull_request'
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g "@fission-ai/openspec@$OPENSPEC_VERSION"
      - run: python3 -m unittest discover -s scripts/tests
      - run: openspec validate --all --strict --no-interactive
      - run: openspec validate --archived --strict --no-interactive
      - name: Validate proposed squash message
        if: github.event_name == 'pull_request'
        run: python3 scripts/openspec_ci.py check-pr "$GITHUB_EVENT_PATH"

  archive:
    name: Archive completed OpenSpec changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, build, openspec]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: openspec-archive-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Skip stale pushes
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main push will process all referenced changes.'
          fi
      - uses: actions/setup-node@v4
        if: steps.current.outputs.current == 'true'
        with:
          node-version: 24
      - run: npm install -g "@fission-ai/openspec@$OPENSPEC_VERSION"
        if: steps.current.outputs.current == 'true'
      - name: Archive complete referenced changes
        if: steps.current.outputs.current == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/openspec_ci.py archive-push "$BEFORE" "$AFTER"
      - name: Commit and push archives to main
        if: steps.current.outputs.current == 'true'
        run: |
          if [ -z "$(git status --porcelain -- openspec)" ]; then
            echo 'No completed changes to archive.'
            exit 0
          fi
          if [ -n "$(git status --porcelain -- . ':!openspec')" ]; then
            echo 'Archiving changed files outside openspec/; refusing to publish.'
            git status --porcelain
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- openspec
          git commit -q -F - <<MSG
          chore: archive completed OpenSpec changes

          Generated from main revision $GITHUB_SHA.

          OpenSpec-Change: none
          MSG
          # A plain push is rejected if main moved; the next successful run
          # rescans history and archives the same changes.
          if ! git push origin HEAD:refs/heads/main; then
            echo 'Main advanced during archiving; a later successful run will recover.'
          fi

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml
